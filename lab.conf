# Sovereign Homelab configuration - one place for the lab's names, network and credentials.
# The lab is fully ISOLATED (no route out), so these defaults are safe to keep.
# To change any of them, edit here (or copy to lab.local.conf) BEFORE running the builder;
# every VM and every script reads from this file.

# --- keyboard layout baked into the guests (US by default; e.g. de, gb, fr, es) ---
# Applies to Linux consoles and to the Windows input locale. UI language stays en-US.
LAB_KEYMAP="us"

# --- base image versions / user-supplied ISOs ---
# Kali release drives the QEMU image download URL in 10-kali.sh.
KALI_RELEASE="2026.2"
# Windows Evaluation Center ISOs you download yourself (see builder/README.md). Absolute paths.
# Leave blank to let 50-windows.sh glob builder/downloads/ for *CLIENT*EVAL*.iso and *SERVER*EVAL*.iso.
WIN11_ISO=""
WINSRV_ISO=""

# --- network (isolated) ---
LAB_NET_NAME="hacklab"
LAB_BRIDGE="virbrlab0"
LAB_SUBNET="10.13.37.0/24"
LAB_HOST_IP="10.13.37.1"          # your KVM host, on the isolated bridge
LAB_STORAGE_POOL="vms"
LAB_STORAGE_DIR="/var/lib/libvirt/images/sovereign-homelab"

# --- shared lab password (Windows + AD; safe because isolated) ---
LAB_PASS="Hacklab2026!"

# --- attacker ---
KALI_IP="10.13.37.10"; KALI_USER="kali"; KALI_PASS="kali"

# --- Linux / web targets ---
MSF2_IP="10.13.37.20"                                   # Metasploitable 2 (built-in msfadmin/msfadmin)
DVWA_IP="10.13.37.34"                                   # DVWA container :80  (admin/password)
JUICE_IP="10.13.37.35"                                  # OWASP Juice Shop :3000 (self-register)
BLUE_IP="10.13.37.40"; BLUE_USER="analyst"; BLUE_PASS="BlueLab-2026"   # Debian hardening target

# --- Windows / Active Directory ---
AD_DOMAIN="hacklab.local"; AD_NETBIOS="HACKLAB"
WINDC_IP="10.13.37.50"                                  # Server 2022 DC (Administrator / $LAB_PASS)
WINCLI_IP="10.13.37.51"; WINCLI_USER="labadmin"         # Win11 desktop (labadmin / $LAB_PASS)
AD_USER1="j.mueller"                                    # normal domain user  ($LAB_PASS)
AD_SVC="svc-backup"                                     # weak service account, in Domain Admins ($LAB_PASS)

# --- Bitcoin node (regtest, deliberately weak - the flagship hardening target) ---
NODE_IP="10.13.37.60"; NODE_USER="node"; NODE_PASS="NodeLab-2026"
NODE_RPC_USER="rpc"; NODE_RPC_PASS="rpcpassword"        # intentionally weak, to be hardened

# --- branding backlinks (baked into the machines) ---
BRAND_SITE="https://twentyone.life"
BRAND_GITHUB="https://github.com/TwentyOneLife"
BRAND_NOSTR="TwentyOneLife@primal.net"
BRAND_DONATE_BTCB="1BH665bXvEqSuoWQUihiQiPpt2BqpzrgGD"
