version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
    groups:
      npm-all:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
